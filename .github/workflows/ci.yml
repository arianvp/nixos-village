on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build:
    permissions:
      id-token: write
      attestations: write
      contents: read
    runs-on: ubuntu-latest
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/checkout@v4
      - run: nix flake check --keep-going
 
